name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest already ships a complete Android SDK (platforms and
      # build-tools included). android-actions/setup-android re-downloads
      # cmdline-tools and its licence step exits 1, so it is deliberately not used.
      - name: Report Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true
          command -v sdkmanager || true

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # Optional: set ANDROID_KEYSTORE_BASE64 + the three password/alias secrets to
      # sign with your own keystore. Without them the checked-in demo keystore is
      # used, which still yields an installable, upgrade-compatible APK.
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks
            echo "ANDROID_KEYSTORE_PATH=keystore/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          VERSION=$(grep -o 'content="[0-9][^"]*" name="application-version"' src/index.html \
            | head -1 | sed 's/content="//; s/".*//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # The app carries no native libraries, so there is nothing to split by
          # ABI: one universal APK installs on every device.
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ChatDemo.apk
          ls -lh dist

      # Fail the build unless the APK is what we claim it is. A green Gradle run
      # only proves it compiled; these checks prove what actually shipped.
      - name: Verify APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "使用 build-tools: $BT"
          APK=dist/ChatDemo.apk

          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt
          cat /tmp/badging.txt | head -12

          grep -q "package: name='com.ywnh1.chatdemo'" /tmp/badging.txt || { echo '::error::包名不符'; exit 1; }
          grep -q "versionName='$VERSION'" /tmp/badging.txt || { echo '::error::版本号不符'; exit 1; }
          grep -q "application-label:'ChatDemo'" /tmp/badging.txt || { echo '::error::应用名不符'; exit 1; }
          grep -q "android.permission.RECORD_AUDIO" /tmp/badging.txt || { echo '::error::缺少录音权限'; exit 1; }
          echo "✓ 包名 / 版本 / 应用名 / 录音权限"

          # Confirm the build really is architecture-independent: an empty lib/
          # is what justifies shipping a single APK instead of per-ABI splits.
          if unzip -l "$APK" | grep -q ' lib/'; then
            echo '::error::APK 含原生库，需要按 ABI 分包'
            exit 1
          fi
          echo "✓ 无原生库，单一 APK 适用于全部架构"

          # The web assets must contain both patches, otherwise the shell loaded
          # a stale copy and the About tab would silently be missing.
          unzip -p "$APK" assets/public/index.html | grep -q 'about-panel.js' || { echo '::error::APK 内缺少 about-panel.js'; exit 1; }
          unzip -p "$APK" assets/public/index.html | grep -q 'native-bridge.js' || { echo '::error::APK 内缺少 native-bridge.js'; exit 1; }
          unzip -l "$APK" | grep -q 'assets/public/about-panel.js' || { echo '::error::补丁文件未打包'; exit 1; }
          echo "✓ 两个补丁脚本均已打包"

          # Custom launcher icon. aapt2 renames res files to short names
          # (res/o-.png), so filenames prove nothing: resolve the real path from
          # the resource table and compare pixels against the art in the repo.
          ICON=$("$BT/aapt2" dump resources "$APK" \
            | grep -A6 'mipmap/ic_launcher$' \
            | grep '(xxxhdpi)' \
            | sed 's/.*(file) //; s/ type=.*//')
          [ -n "$ICON" ] || { echo '::error::资源表中找不到 mipmap/ic_launcher'; exit 1; }
          echo "图标资源: $ICON"

          unzip -p "$APK" "$ICON" > /tmp/apk-icon.png
          command -v compare >/dev/null || { echo '::error::CI 缺少 ImageMagick'; exit 1; }
          identify /tmp/apk-icon.png

          # aapt2's crunch is lossless, so identical art matches near-exactly;
          # a wrong (e.g. default) icon scores ~0.45. Threshold 0.05 leaves room
          # for a possible palette quantisation while keeping that gap.
          # Plain `compare`/`identify` work on ImageMagick 6 and 7; the runner
          # ships v6, which has no `magick` wrapper.
          DIFF=$(compare -metric RMSE /tmp/apk-icon.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png null: 2>&1 || true)
          NORM=$(echo "$DIFF" | sed 's/.*(\(.*\))/\1/')
          echo "与仓库图标的 RMSE: $DIFF"
          awk -v d="$NORM" 'BEGIN { exit (d < 0.05 ? 0 : 1) }' \
            || { echo "::error::APK 内的图标不是仓库里的图标 (RMSE=$NORM)"; exit 1; }
          echo "✓ 图标与仓库源文件一致"

          "$BT/apksigner" verify --print-certs "$APK" | head -4
          echo "✓ 签名有效"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatDemo
          path: dist/ChatDemo.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChatDemo.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
