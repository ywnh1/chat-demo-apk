name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest already ships a complete Android SDK (platforms and
      # build-tools included). android-actions/setup-android re-downloads
      # cmdline-tools and its licence step exits 1, so it is deliberately not used.
      - name: Report Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true
          command -v sdkmanager || true

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # Optional: set ANDROID_KEYSTORE_BASE64 + the three password/alias secrets to
      # sign with your own keystore. Without them the checked-in demo keystore is
      # used, which still yields an installable, upgrade-compatible APK.
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks
            echo "ANDROID_KEYSTORE_PATH=keystore/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          VERSION=$(grep -o 'content="[0-9][^"]*" name="application-version"' src/index.html \
            | head -1 | sed 's/content="//; s/".*//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          OUT=android/app/build/outputs/apk
          mkdir -p dist
          cp "$OUT/arm64/release/app-arm64-release.apk" "dist/chat-demo-$VERSION-arm64-v8a.apk"
          cp "$OUT/universal/release/app-universal-release.apk" "dist/chat-demo-$VERSION-universal.apk"
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chat-demo-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
